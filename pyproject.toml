[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eclipse-aligner"
dynamic = ["version"]
description = "Align a sequence of RAW frames on the un-demosaiced mosaic, preserving raw format. EXR, DNG, NEF, CR2/CR3 and JPEG."
authors = [{ name = "Jose A. Hurtado" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "imagecodecs>=2024.1.1",   # EXR read/write, DNG codecs
    "tifffile>=2024.1.30",     # DNG structure
    "Pillow>=10",              # JPEG
    "scikit-image>=0.22",      # sub-pixel phase correlation
    "rawpy>=0.19",             # LibRaw: NEF, CR2, CR3 in, DNG out
]

[project.urls]
Homepage = "https://elcacharrista.com"

[project.optional-dependencies]
# The editor is a Qt application. Kept behind an extra so a headless machine,
# which can detect and apply perfectly well, never installs a toolkit it has no
# screen for.
gui = ["PySide6>=6.6"]
# Building the macOS bundle. Not needed to run anything, and heavy, so it
# stays out of the way until somebody asks for a .dmg.
mac = ["PySide6>=6.6", "pyinstaller>=6.10"]
# Building the Windows bundle. No PyInstaller: the Windows build lays wheels
# beside an embeddable CPython instead of freezing a binary, so all it needs is
# the toolkit the editor imports -- the wheels are pip-installed into the embed
# by make-win.ps1, resolved from this same project.
win = ["PySide6>=6.6"]

[project.scripts]
eclipse-aligner = "eclipse_aligner.cli:main"

# One source of truth for the version: the package itself, so `--version` and
# the installed metadata cannot drift apart.
[tool.hatch.version]
path = "src/eclipse_aligner/__init__.py"
